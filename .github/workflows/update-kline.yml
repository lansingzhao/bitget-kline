name: Update Bitget Klines

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Bitget klines
        run: python3 fetch_kline.py

      - name: Commit updated JSON
        run: |
          if git diff --quiet -- kline.json; then
            echo "No kline changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kline.json
          git commit -m "chore: update Bitget klines"
          git push
